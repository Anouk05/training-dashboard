# Workout library. Each workout has a stable id so every repeat can be compared.
#   steps: [minutes, intensity] where intensity is easy | moderate | hard | rest
#   match: regex on Garmin activity names, used to find past repeats
#   targets: shown as chips on the Today page
workouts:
  - id: RUN-THR-2k
    name: Threshold 5 × 2 km
    sport: run
    summary: warm-up 10′ · 5 × (2 km + 2′ jog) · cool-down 10′
    steps: [[10, easy], [10, hard], [2, rest], [10, hard], [2, rest], [10, hard], [2, rest], [10, hard], [2, rest], [10, hard], [10, easy]]
    targets: { pace: "4:50–5:00/km", hr: "166–176" }
    match: 'x ?2 ?km'

  - id: RUN-10K-1k
    name: 10K pace 4–6 × 1 km
    sport: run
    summary: warm-up 12′ · 4–6 × (1 km + 2′ jog) · cool-down 10′
    steps: [[12, easy], [4.5, hard], [2, rest], [4.5, hard], [2, rest], [4.5, hard], [2, rest], [4.5, hard], [2, rest], [4.5, hard], [10, easy]]
    targets: { pace: "10K pace · 4:28/km", hr: "176–182" }
    match: 'x ?1 ?K'

  - id: RUN-TEMPO
    name: Tempo 5 km
    sport: run
    summary: warm-up 10′ · 5 km tempo · cool-down 10′
    steps: [[10, easy], [25, moderate], [10, easy]]
    targets: { pace: "5:00–5:10/km", hr: "158–166" }
    match: 'tempo'

  - id: RUN-LONG
    name: Long run 14–20 km
    sport: run
    summary: steady Z1–Z2
    steps: [[95, easy]]
    targets: { pace: "5:50–6:10/km", hr: "< 158" }
    match_long_run_km: 15

  - id: RIDE-Z2
    name: Endurance ride
    sport: ride
    summary: steady Z2
    steps: [[10, easy], [70, easy], [10, easy]]
    targets: { power: "150–170 W", hr: "< 151" }
    match_long_ride_min: 80

  - id: RIDE-TEST-6m
    name: 6-minute power test
    sport: ride
    summary: warm-up 20′ · 4′ openers · 6′ all-out · cool-down 15′
    steps: [[20, easy], [4, moderate], [10, easy], [6, hard], [15, easy]]
    match: '6m test'

  - id: ROW-STEADY
    name: Steady state row
    sport: row
    summary: long steady UT2
    steps: [[10, easy], [60, easy], [5, easy]]
    match_sport: row

  - id: STR-A
    name: Strength A · lower body
    sport: str
    summary: squat, RDL, lunges, core · 45′
    steps: [[45, moderate]]
    match_sport: str

  - id: STR-B
    name: Strength B · upper body
    sport: str
    summary: pull, push, rows, core · 40′
    steps: [[40, moderate]]

  - id: TEST-LTHR
    name: LTHR test · 30′ time trial
    sport: run
    summary: warm-up 15′ · 30′ solo all-out · cool-down 10′
    steps: [[15, easy], [30, hard], [10, easy]]
